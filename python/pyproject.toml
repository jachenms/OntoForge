[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ontoforge"
version = "1.0.0"
description = "Ontology workbench domain core — Python port of the OntoForge CORE/SEED engine (schema, objects, links, actions, branches, proposals)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["ontology", "domain-model", "prototype"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/ontoforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]   # 免安装直跑;pip install -e . 后亦不冲突
